# Frontend/UI jobs, split out of .gitlab-ci.yml (see the include there).

# Kept here, not in .gitlab-ci.yml, so a bump matches the change paths below.
variables:
  PLAYWRIGHT_IMAGE_TAG: "v1.60.0-noble"

# Paths that make the frontend jobs (ensure-playwright-image, frontend_e2e_test,
# frontend_lint, chromatic) worth running. Backend-only pushes skip all four.
# This file is listed rather than .gitlab-ci.yml so job edits re-run them without
# every unrelated CI edit matching.
.frontend-change-paths: &frontend-change-paths
  - frontend/**/*
  - src/main/resources/static/**/*
  - src/main/resources/static-legacy/**/*
  - src/main/resources/templates/**/*
  - src/main/resources/templates-legacy/**/*
  - .gitlab/ci/frontend.yml

# Two rules are needed because `changes:` alone always matches on the first
# push of a new branch (GitLab has no previous SHA to diff against) — which is
# how chromatic used to run, and post its pending "UI Tests"/"UI Review"
# external statuses, on backend-only branches. `compare_to` closes that hole
# for feature branches by diffing against master instead of the push. The
# long-lived branches (master/demo/production) keep the plain push-diff
# comparison, because diffing master against itself would never match and the
# jobs would never run there.
.frontend-rules: &frontend-rules
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "demo" || $CI_COMMIT_BRANCH == "production"'
      changes: *frontend-change-paths
    - if: '$CI_COMMIT_BRANCH'
      changes:
        paths: *frontend-change-paths
        compare_to: 'refs/heads/master'

# Mirror the upstream Playwright image into the project container registry so the
# e2e job does not pull from mcr.microsoft.com on every pipeline (which trips its
# rate limits on shared runners). Only pulls from upstream when the tag is missing.
# Same rules as frontend_e2e_test (its only consumer) so its `needs:` entry is
# always satisfiable.
ensure-playwright-image:
  stage: build
  interruptible: true
  needs: []
  image:
    name: quay.io/skopeo/stable:latest
    # Clear the image ENTRYPOINT (/usr/bin/skopeo) so GitLab runs the script in a shell
    entrypoint: [""]
  script:
    - DEST="$CI_REGISTRY_IMAGE/playwright:$PLAYWRIGHT_IMAGE_TAG"
    - SRC="mcr.microsoft.com/playwright:$PLAYWRIGHT_IMAGE_TAG"
    - |
      if skopeo inspect --creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$DEST" >/dev/null 2>&1; then
        echo "Already mirrored: $DEST — skipping upstream pull"
      else
        echo "Not in registry, mirroring $SRC -> $DEST"
        skopeo copy "docker://$SRC" --dest-creds "$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD" "docker://$DEST"
      fi
  <<: *frontend-rules

frontend_e2e_test:
  stage: test
  interruptible: true
  needs: ["ensure-playwright-image"]
  image: $CI_REGISTRY_IMAGE/playwright:$PLAYWRIGHT_IMAGE_TAG
  script:
    - node -v && npm -v
    - cd frontend
    - npm install
    # Storybook play-function + axe a11y suite; needs this image's headless Chromium
    - npm run test-storybook
    - npx playwright test --config playwright.config.js
  artifacts:
    when: on_failure
    paths:
      - frontend/test-results/
    expire_in: 7 days
  <<: *frontend-rules

# frontend_lint: runs the same `npm run test:ci` chain contributors run locally
# (format:check + lint + test:unit + type-check + lint:jsdoc + lint:icons +
# lint:lit-analyzer + codegen:check). Parallel to `build` (needs: []);
# conceptually a peer of `check-trailing-whitespace` in the build stage.
#
# test:unit (vitest --project=unit) is included here specifically because no
# other job runs it — frontend_e2e_test only runs the Storybook/Playwright
# projects, so a plain-JS unit-test regression would otherwise go unnoticed
# by CI until someone ran it locally (see #1917).
#
# Blocking since 2026-08-13 (the R22/R23 sunset): two weeks green on master,
# legacy-override tier in eslint.config.js empty, and the a11y gate's
# Storybook half now blocking in frontend_e2e_test. The page-level half
# (@axe-core/playwright in the e2e specs) is deferred — see "Accessibility
# testing" in frontend/README.md.
#
# --ignore-scripts justification: safe here because test:ci launches no
# browser and doesn't need MSW's postinstall hook — the MSW worker is
# pre-checked-in at frontend/public/mockServiceWorker.js. This is documented
# in frontend/README.md so no one copies the flag into test:e2e (where it
# would break browser provisioning).
#
# corepack enable npm justification: node:22-alpine ships npm 10.9.7 but
# package.json pins `packageManager: npm@11.12.1`, and the two majors encode
# optional peer deps differently in the lockfile. `corepack enable npm` shims
# npm to the pinned version so CI and contributors use the same tool.
frontend_lint:
  stage: build
  interruptible: true
  needs: []
  image: node:22-alpine
  cache:
    key: frontend-npm
    paths:
      - frontend/.npm    # npm's package cache (populated via NPM_CONFIG_CACHE below)
      # Do NOT cache frontend/node_modules: a cached copy can drift from
      # package.json / package-lock.json and mask install-time errors.
  variables:
    # npm's default cache is $HOME/.npm, which GitLab's cache directive can't reach.
    # Override to a path inside $CI_PROJECT_DIR so the cache block above is effective.
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  before_script:
    - apk add --no-cache bash libxml2-utils   # lint scripts use bash and xmllint; Alpine ships neither by default
    - corepack enable npm       # activate packageManager pin (npm 11.12.1 instead of Alpine's bundled 10.9.7)
  script:
    - cd frontend
    - npm ci --ignore-scripts
    - npm run test:ci
  <<: *frontend-rules

# chromatic: publishes the frontend Storybook to https://www.chromatic.com for
# visual regression review (https://www.chromatic.com/docs/gitlab/).
# CLI behavior lives in frontend/chromatic.config.json so local runs and CI
# stay identical: exitZeroOnChanges, onlyChanged (TurboSnap), storybookBaseDir.
#
# Non-blocking by design, two layers deep:
# - `exitZeroOnChanges` (config file): visual diffs against the accepted
#   baseline exit 0; changes are reviewed and accepted/denied in the Chromatic
#   UI, not by failing the pipeline.
# - `allow_failure: true`: broken stories or Chromatic infrastructure errors
#   surface as a pipeline warning, never a failure. Flip to blocking only with
#   team sign-off, once the a11y backlog is fixed or formally dismissed in
#   Chromatic (mirrors the frontend_lint promotion approach above).
#
# Snapshot quota: `onlyChanged` (TurboSnap) snapshots only stories whose
# dependency graph intersects the changed files — TurboSnap activates after
# Chromatic's 10-successful-CI-builds threshold; until then builds are full
# (~650 snapshots). The shared frontend rules below already skip backend-only
# pushes entirely.
#
# The project token is committed in plain text deliberately: per Chromatic's
# docs (https://www.chromatic.com/docs/custom-ci-provider/) it can only be used
# to *publish* builds — it grants no access to the account, settings, or
# baseline acceptance. Setting a masked CI/CD variable requires Maintainer
# access on this project; a maintainer can move it to Settings > CI/CD >
# Variables (name: CHROMATIC_PROJECT_TOKEN) and delete the line here — the CLI
# reads the environment variable automatically.
#
# GIT_DEPTH: 0 disables GitLab's shallow clone so Chromatic can walk git
# history to find the baseline build on an ancestor commit; without it every
# build is treated as new and snapshot diffs are meaningless.
#
# The shared frontend rules (`*frontend-rules`) skip the job for backend-only
# pushes — each run snapshots all ~650 stories, which counts against the
# Chromatic plan's monthly snapshot quota. Skipping also stops Chromatic from
# posting its "UI Tests"/"UI Review" external statuses (delivered via the
# project's index.chromatic.com webhook) onto pipelines that contain no UI
# change, where they would sit pending forever waiting for a snapshot review.
# Chromatic tolerates the gaps: baseline lookup walks ancestor commits until
# it finds the last published build.
#
# --ignore-scripts is safe here for the same reason as frontend_lint: the
# Storybook *build* needs no browser and no postinstall hooks (esbuild/rollup
# ship platform binaries as optionalDependencies, not postinstall scripts).
chromatic:
  stage: build
  interruptible: true
  needs: []
  image: node:22-alpine
  cache:
    key: frontend-npm
    paths:
      - frontend/.npm
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
    GIT_DEPTH: 0
    CHROMATIC_PROJECT_TOKEN: "chpt_f4cadedd64e8a97"
  before_script:
    - apk add --no-cache git   # the Chromatic CLI shells out to git for baseline detection
    - corepack enable npm      # activate packageManager pin (see frontend_lint)
  script:
    - cd frontend
    # --prefer-offline uses the npm cache and falls back to the network only on a miss;
    # --no-audit/--no-fund skip network/log noise. Safe with the committed lockfile.
    - npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
    # --diagnostics-file dumps build/timing/baseline context to chromatic-diagnostics.json
    # (uploaded as an artifact below) — the first place to look when a run misbehaves.
    - npx chromatic --diagnostics-file=chromatic-diagnostics.json
  # chromatic-diagnostics.json is written under frontend/ (the script's cwd); artifacts:paths
  # resolve from $CI_PROJECT_DIR, so the path is frontend/-prefixed. when:always captures it
  # even when chromatic exits non-zero.
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/chromatic-diagnostics.json
  allow_failure: true
  <<: *frontend-rules
