# Authenticating proxy in front of the Cerbos AuthZEN PDP for CI (docker-compose-localtest.yml).
# The Cerbos certification PDP does not authenticate callers; each server block below adds one
# authentication method, so the suite's api_key, client_secret_basic and mtls variants and its
# 401 modules run against a PDP that enforces them. Each block passes requests that carry the
# expected credentials to Cerbos and answers others with 401.
#
# The PDP metadata at /.well-known/ is served without credentials, as other OpenID discovery
# documents are. Cerbos builds its metadata (plain and signed) from the request's Host header,
# so forwarding the proxy's Host makes the metadata name the proxy's endpoints.
#
# The credentials must match the test configurations next to this file:
#   9443 api_key             authzen-auth-proxy-api-key-config.json
#   9444 client_secret_basic authzen-auth-proxy-client-secret-basic-config.json
#   9445 mtls                authzen-auth-proxy-mtls-config.json

events {}

http {
	access_log /dev/stdout;
	error_log /dev/stderr info;
	# The Authorization header values below are longer than the default bucket holds.
	map_hash_bucket_size 128;

	# map compares plain strings ignoring case, so the credentials are matched with regular
	# expressions, which are case-sensitive; only the auth scheme is case-insensitive, as
	# RFC 9110 Section 11.1 makes it.

	# Authorization: Bearer <API key>
	map $http_authorization $api_key_ok {
		"~^(?i:bearer) authzen-ci-api-key$" 1;
		default 0;
	}

	# client_secret_basic: client_id "authzen-ci-pep", client_secret "ci+secret/=", each
	# form-URL-encoded before base64 as RFC 6749 Section 2.3.1 requires, so the special
	# characters also check the suite's encoding: base64("authzen-ci-pep:ci%2Bsecret%2F%3D").
	map $http_authorization $basic_ok {
		"~^(?i:basic) YXV0aHplbi1jaS1wZXA6Y2klMkJzZWNyZXQlMkYlM0Q=$" 1;
		default 0;
	}

	# SHA-1 fingerprint of the mtls.cert in authzen-auth-proxy-mtls-config.json
	# (CN=authzen-conformance-pep).
	map $ssl_client_fingerprint $client_cert_ok {
		"a45ac3b1b406465db67472627e493fb02178bf4a" 1;
		default 0;
	}

	ssl_certificate /tmp/authzen-auth-proxy.crt;
	ssl_certificate_key /tmp/authzen-auth-proxy.key;

	proxy_ssl_server_name on;
	proxy_ssl_name cerbos-authzen-pdp;
	proxy_set_header Host $http_host;

	server {
		listen 9443 ssl;
		server_name authzen-auth-proxy;

		location /.well-known/ {
			proxy_pass https://cerbos-authzen-pdp:8443;
		}

		location / {
			error_page 401 = @unauthorized;
			if ($api_key_ok = 0) {
				return 401;
			}
			proxy_pass https://cerbos-authzen-pdp:8443;
		}

		location @unauthorized {
			add_header WWW-Authenticate 'Bearer realm="authzen"' always;
			add_header X-Request-ID $http_x_request_id always;
			default_type application/json;
			return 401 '{"error":"unauthorized"}';
		}
	}

	server {
		listen 9444 ssl;
		server_name authzen-auth-proxy;

		location /.well-known/ {
			proxy_pass https://cerbos-authzen-pdp:8443;
		}

		location / {
			error_page 401 = @unauthorized;
			if ($basic_ok = 0) {
				return 401;
			}
			proxy_pass https://cerbos-authzen-pdp:8443;
		}

		location @unauthorized {
			add_header WWW-Authenticate 'Basic realm="authzen"' always;
			add_header X-Request-ID $http_x_request_id always;
			default_type application/json;
			return 401 '{"error":"unauthorized"}';
		}
	}

	server {
		listen 9445 ssl;
		server_name authzen-auth-proxy;
		# The client certificate is self-signed, so it is matched by fingerprint, not by a CA.
		ssl_verify_client optional_no_ca;

		location /.well-known/ {
			proxy_pass https://cerbos-authzen-pdp:8443;
		}

		location / {
			error_page 401 = @unauthorized;
			if ($client_cert_ok = 0) {
				return 401;
			}
			proxy_pass https://cerbos-authzen-pdp:8443;
		}

		location @unauthorized {
			add_header X-Request-ID $http_x_request_id always;
			default_type application/json;
			return 401 '{"error":"unauthorized"}';
		}
	}
}
