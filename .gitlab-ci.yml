# Throwaway: does a GitLab-hosted Linux runner expose KVM (needed for an accelerated Android emulator)?
.probe:
  image: alpine:3.20
  script:
    - uname -a; nproc; free -m | head -2
    - grep -m1 "model name" /proc/cpuinfo
    - echo "vmx/svm flags:" $(grep -cE '\b(vmx|svm)\b' /proc/cpuinfo)
    - ls -l /dev/kvm || echo "NO /dev/kvm in job container"
    - "[ -e /sys/module/kvm ] && echo 'kvm module loaded on host' || echo 'kvm module not visible'"
    - "cat /sys/module/kvm_intel/parameters/nested 2>/dev/null || cat /sys/module/kvm_amd/parameters/nested 2>/dev/null || echo 'no nested param visible'"
probe-small:
  extends: .probe
  tags: [saas-linux-small-amd64]
probe-medium:
  extends: .probe
  tags: [saas-linux-medium-amd64]
probe-large:
  extends: .probe
  tags: [saas-linux-large-amd64]
probe-xlarge:
  extends: .probe
  tags: [saas-linux-xlarge-amd64]
