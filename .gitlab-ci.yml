# Throwaway: run the EC reference wallet in an emulator on the tea runner against the suite on demo.
android_wallet_test:
  tags: [android]
  image: eudiw-android:1
  timeout: 45m
  variables:
    GIT_DEPTH: "10"
    ANDROID_HOME: /eudiw/sdk
    WALLET_APK: /eudiw/out/app-demo-debug-logging.apk
    ANDROID_WORK_DIR: $CI_PROJECT_DIR/.android-work
    ARTIFACT_DIR: $CI_PROJECT_DIR/android-wallet-artifacts
    CONFORMANCE_SERVER: https://demo.certification.openid.net/
  script:
    - apt-get update -qq && apt-get install -y -qq python3 > /dev/null
    - export CONFORMANCE_TOKEN=${CONFORMANCE_TOKEN:-$CI_TOKEN}
    - '[ -n "$CONFORMANCE_TOKEN" ] || { echo "Neither CONFORMANCE_TOKEN nor CI_TOKEN is set for this branch"; exit 1; }'
    - scripts/android-wallet/start-emulator.sh
    - export HOME=$ANDROID_WORK_DIR/home PATH=$ANDROID_HOME/platform-tools:$PATH
    - scripts/android-wallet/run-wallet-tests.py vci-issuance scripts/android-wallet/vci-ec-wallet-config.json
  after_script:
    - cp .android-work/emulator.log android-wallet-artifacts/ 2>/dev/null || true
  artifacts:
    when: always
    paths:
      - android-wallet-artifacts/
