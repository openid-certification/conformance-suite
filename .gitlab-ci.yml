# Throwaway: can a job on the tea runner (tag android) use KVM for an accelerated Android emulator?
probe-tea-android:
  tags: [android]
  image: python:3.12-alpine
  timeout: 10m
  script:
    - uname -a; nproc; free -m | head -2; df -h / /dev/shm | tail -2
    - grep -m1 "model name" /proc/cpuinfo
    - echo "vmx/svm flags:" $(grep -cE '\b(vmx|svm)\b' /proc/cpuinfo)
    - id; ls -ln /dev/kvm
    # KVM_GET_API_VERSION = _IO(0xAE, 0x00); a usable /dev/kvm answers 12
    - python3 -c 'import fcntl,os; fd=os.open("/dev/kvm",os.O_RDWR); print("KVM API version", fcntl.ioctl(fd,0xAE00))'
    # KVM_CREATE_VM = _IO(0xAE, 0x01); proves the job may create a VM, not just open the device
    - python3 -c 'import fcntl,os; fd=os.open("/dev/kvm",os.O_RDWR); vm=fcntl.ioctl(fd,0xAE01,0); print("KVM_CREATE_VM fd", vm)'
    - wget -q -O /dev/null -S https://demo.certification.openid.net/ 2>&1 | head -1
