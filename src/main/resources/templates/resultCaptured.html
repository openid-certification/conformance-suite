<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OIDF Conformance: Result captured</title>

    <!-- Served to the suite's own headless browser: only suite-hosted assets and no components; the chrome
         below reuses the cts-navbar / cts-page-head / cts-footer rules from oidf-app.css -->
    <link rel="stylesheet" href="/css/oidf-tokens.css">
    <link rel="stylesheet" type="text/css" href="/css/layout.css">
    <link rel="stylesheet" href="/css/oidf-app.css">
</head>
<body>
    <nav class="cts-nav">
        <a class="cts-brand" href="/plans.html">
            <img src="/images/openid-dark.svg" alt="OpenID Foundation" width="93" height="28">
            <span class="cts-brand-name">CONFORMANCE SUITE</span>
        </a>
    </nav>

    <main class="narrow-page">
        <div class="oidf-page-head">
            <div class="oidf-page-head-text">
                <h1 class="t-title oidf-page-head-title">Response received</h1>
            </div>
        </div>
        <p id="complete">The response has been sent to the server for processing. You may return to <a th:href="${returnUrl}">the test results page.</a></p>
    </main>

    <footer class="oidf-footer pageFooter t-meta">OpenID Foundation conformance suite</footer>
</body>
</html>
