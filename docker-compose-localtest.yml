services:
  oidcc-provider:
    # To start just the provider to run tests against for dev use:
    # docker-compose -f docker-compose-localtest.yml up oidcc-provider
    # and add an entry to /etc/hosts '127.0.0.1 oidcc-provider'
    # To run the tests, start java suite in IDE & run:
    # ./.gitlab-ci/run-tests.sh --local-provider-tests
    image: panvafs/oidc-provider-oidc-core-sample
    ports:
      - "3000:3000"
    volumes:
      - "./.gitlab-ci/local-provider-oidcc.json:/home/node/app/config.json"
      - "./.gitlab-ci/local-provider.key:/home/node/app/server.key"
      - "./.gitlab-ci/local-provider-oidcc.crt:/home/node/app/server.crt"
      - "./:/conformance-suite/"
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "( [ -f /conformance-suite/.gitlab-ci/local-provider-oidcc-conformance-config.json ] || docker-entrypoint.sh plan > /conformance-suite/.gitlab-ci/local-provider-oidcc-conformance-config.json ) && exec docker-entrypoint.sh server"
  mongodb:
    image: mongo:6.0.13
    volumes:
     - ./mongo/data:/data/db
  nginx:
    build:
      context: ./nginx
    ports:
     - "8443:8443"
     - "8444:8444"
     - "8445:8445"
    depends_on:
     - server

  cerbos:
    # Cerbos PDP server used for AuthZEN evaluation(s) endpoint tests
    image: ghcr.io/cerbos/cerbos:0.55.0
    volumes:
      - ./scripts/test-configs-authzen/cerbos/policies:/policies
    ports:
      - "3592:3592"

  cerbos-authzen-adapter:
    # The image bundles the adapter script and generates its own self-signed TLS
    # pair at build time, so no cert/key is kept in the repository. Rebuild after
    # editing cerbos-authzen-adapter.js:
    #   docker compose -f docker-compose-localtest.yml build cerbos-authzen-adapter
    build:
      context: ./scripts/test-configs-authzen/cerbos-authzen-adapter
    environment:
      CERBOS_URL: http://cerbos:3592
      LISTEN_PORT: "9090"
      # Serve HTTPS with the self-signed pair baked into the image (see its
      # Dockerfile); unset either one to fall back to plain HTTP.
      TLS_CERT: /certs/cert.pem
      TLS_KEY: /certs/key.pem
      # Advertise where clients actually reach the PDP: the adapter itself, on
      # HTTP or HTTPS at localhost:9090. Behind a real TLS-terminating proxy set these to
      # the external scheme/host, e.g. FORWARDED_PROTO=https and
      # FORWARDED_HOST=cerbos.example.com:9443 (the port must be in the host).
      FORWARDED_PROTO: https
      FORWARDED_HOST: cerbos-authzen-adapter:9090
      # Set true when another reverse proxy in front already sets
      # X-Forwarded-Proto/Host, so its values are preserved (config becomes a
      # fallback used only when the inbound header is absent).
      TRUST_FORWARDED_HEADERS: "false"
    ports:
      - "9090:9090"
    depends_on:
      - cerbos

  server:
    build:
      context: ./server-dev
    ports:
     - "9999:9999"
    volumes:
     - ./target/:/server/
    environment:
     - DEVMODE=${DEVMODE:-true}
    entrypoint: /bin/sh
    command:
     - -c
     - >
       java
       -Xdebug -Xrunjdwp:transport=dt_socket,address=*:9999,server=y,suspend=n
       -jar /server/fapi-test-suite.jar
       -Djdk.tls.maxHandshakeMessageSize=65536
       --fintechlabs.base_url=https://nginx:8443
       --fintechlabs.base_mtls_url=https://nginx:8444
       --fintechlabs.devmode=$$DEVMODE
       --fintechlabs.startredir=true
    links:
     - mongodb:mongodb
    depends_on:
     - mongodb
     - oidcc-provider
     - cerbos-authzen-adapter
    logging:
      # make sure we keep a reasonable amount of logs, as there's no other way to see results on the CI
      driver: "json-file"
      options:
        max-size: "500m"
        max-file: "1"
  test:
    depends_on:
      - nginx
    build:
      context: ./test
    environment:
      CONFORMANCE_SERVER: https://nginx:8443/
      CONFORMANCE_SERVER_MTLS: https://nginx:8444/
      CONFORMANCE_DEV_MODE: 1
    volumes:
      - "./:/conformance-suite/"
    working_dir: "/conformance-suite"
    entrypoint:
      - "../conformance-suite/.gitlab-ci/run-tests.sh"
      - "--local-provider-tests"
